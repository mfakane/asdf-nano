---
name: Commit workflow
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare plugin test ref
        run: git branch --force plugin-test HEAD

      - name: Setup ruby (on macOS)
        if: matrix.os == 'macOS-latest'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
    
      - name: Install Homebrew dependencies (on macOS)
        if: matrix.os == 'macOS-latest'
        run: |
          env HOMEBREW_NO_AUTO_UPDATE=1 brew install automake groff texinfo
          echo "/usr/local/opt/texinfo/bin" >> $GITHUB_PATH
      
      - name: Install apt dependencies (on ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y autopoint gettext groff texinfo
      
      - name: asdf plugin test
        uses: asdf-vm/actions/plugin-test@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4
        with:
          command: nano --version
          github_token: ${{ secrets.GITHUB_TOKEN }}
          giturl: ${{ github.workspace }}
          gitref: plugin-test
          version: "9.2" # latest version as of 2026-09-23
